title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        UX や機能の提案用です。採用して正式な追跡が必要になった提案は、メンテナーが Issue にします。
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと
      description: どの利用場面で、何が困るかを記入してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: 期待する操作や結果を記入してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案（任意）
      description: 現在の回避策や比較した方法があれば記入してください。
