name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Image cropping and OCR integration tests invoke these tools directly.
      - name: Install image and OCR tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick tesseract-ocr
      - name: Install image and OCR tools (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick tesseract
      - name: Install image and OCR tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install imagemagick tesseract -y --no-progress
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/routerctl
