apiVersion: routerctl.dev/device/v1alpha1
kind: HardwareDevice
metadata:
  id: tplink-archer-ax23v-v1
spec:
  vendor: TP-Link
  model: Archer AX23V
  hardwareVersion: "1.0"
  family: archer-ax23
  # AX23V reuses the AX23 v1 OpenWrt base, but is not treated as the same
  # physical product. Its differences are declared in overlays/ax23v.yaml.
  baseDevice: tplink-archer-ax23-v1
